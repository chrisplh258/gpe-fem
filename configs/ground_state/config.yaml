mesh:
  domain:
    xmin: -2.8
    ymin: -3.8
    xmax: 2.8
    ymax: 3.8

  resolution:
    k: 2  # mesh refinement level (controls h = 2^{-k})

  element:
    degree: 1

physics:
  epsilon: 0.25      # scaling parameter (epsilon=1 corresponds to the unscaled problem)
  beta_unscaled: 20   # interaction strength (unscaled)
  omega_unscaled: 1.1  # rotation frequency (unscaled)

  potential_unscaled:  # parameters of the harmonic trapping potential (before scaling)
    gamma_x: 1.25
    gamma_y: 0.98
    trap_strength: 0.5

solver:
  quadrature_degree: 3
  tolerance: 1.0e-11

initial_condition:
  # mode options:
  # - superposition: analytical Gaussian + vortex superposition 
  # - projected_reference: load a fine solution and project it onto the current mesh 
  # - loaded_state: load a precomputed solution already defined on the target mesh (e.g results/gs_20260327_131900_eps0.05_h0.125)
  mode: superposition
  path: null #path: null     (if superposition)
