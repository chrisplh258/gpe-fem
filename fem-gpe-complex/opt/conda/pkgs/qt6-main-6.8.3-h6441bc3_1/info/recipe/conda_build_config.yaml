CI: azure
alsa_lib: '1.2'
c_compiler: gcc
c_compiler_version: '13'
c_stdlib: sysroot
c_stdlib_version: '2.17'
cdt_name: conda
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
curl: '8'
cxx_compiler: gxx
cxx_compiler_version: '13'
dbus: '1'
docker_image: quay.io/condaforge/linux-anvil-x86_64:alma9
extend_keys:
- extend_keys
- ignore_version
- ignore_build_only_deps
- pin_run_as_build
fontconfig: '2'
fortran_compiler: gfortran
freetype: '2'
glib: '2'
harfbuzz: '11'
icu: '75'
ignore_build_only_deps:
- python
- numpy
krb5: '1.21'
libjpeg_turbo: '3'
libpng: '1.6'
libsqlite: '3'
libtiff: '4.7'
libwebp: '1'
libxcb: '1'
libxml2: '2'
lua: '5'
numpy: '1.26'
openssl: '3'
pcre2: '10.44'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
postgresql: '17'
python: '3.12'
r_base: '3.5'
target_platform: linux-64
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
zlib: '1'
zstd: '1.5'
