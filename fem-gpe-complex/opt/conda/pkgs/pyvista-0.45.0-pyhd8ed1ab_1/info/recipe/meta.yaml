about:
  description: 'PyVista: 3D plotting and mesh analysis through a streamlined interface
    for the Visualization Toolkit (VTK). PyVista is a helper module for the Visualization
    Toolkit (VTK) that takes a different approach on interfacing with VTK through
    NumPy and direct array access. This package provides a Pythonic, well-documented
    interface exposing VTK''s powerful visualization backend to facilitate rapid prototyping,
    analysis, and visual integration of spatially referenced datasets. This module
    can be used for scientific plotting for presentations and research papers as well
    as a supporting module for other mesh dependent Python modules.

