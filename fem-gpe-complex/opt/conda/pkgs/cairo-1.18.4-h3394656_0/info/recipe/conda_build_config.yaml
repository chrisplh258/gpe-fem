CI: azure
c_compiler: gcc
c_compiler_version: '13'
c_stdlib: sysroot
c_stdlib_version: '2.17'
cairo: '1'
cdt_name: conda
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: gxx
cxx_compiler_version: '13'
docker_image: quay.io/condaforge/linux-anvil-x86_64:alma9
expat: '2'
extend_keys:
- ignore_version
- extend_keys
- pin_run_as_build
- ignore_build_only_deps
fontconfig: '2'
fortran_compiler: gfortran
freetype: '2'
glib: '2'
icu: '75'
ignore_build_only_deps:
- python
- numpy
libpng: '1.6'
libxcb: '1'
lua: '5'
numpy: '1.26'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
pixman: '0'
python: '3.12'
r_base: '3.5'
target_platform: linux-64
xz: '5'
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
zlib: '1'
