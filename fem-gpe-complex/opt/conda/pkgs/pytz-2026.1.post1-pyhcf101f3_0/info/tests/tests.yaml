- python:
    imports:
    - pytz
    python_version:
    - 3.10.*
    - 3.14.*
- script:
    content: |-
      cd pytz/tests
      coverage run --source=pytz --branch -m pytest -vv --tb=long --color=yes
      coverage report --show-missing --skip-covered --fail-under=69
    cwd: etc/conda/test-files/pytz/1
  requirements:
    run:
    - pytest-cov
    - python 3.10.*
  files:
    source:
    - README.rst
    - pytz/tests
