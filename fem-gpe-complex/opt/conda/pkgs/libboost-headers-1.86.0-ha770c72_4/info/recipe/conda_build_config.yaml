CI: azure
bzip2: '1'
c_compiler: gcc
c_stdlib: sysroot
c_stdlib_version: '2.17'
cdt_name: conda
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: gxx
cxx_compiler_version: '14'
docker_image: quay.io/condaforge/linux-anvil-x86_64:alma9
extend_keys:
- pin_run_as_build
- extend_keys
- ignore_version
- ignore_build_only_deps
fortran_compiler: gfortran
icu: '75'
ignore_build_only_deps:
- python
- numpy
liblzma_devel: '5'
lua: '5'
numpy: '2'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: 3.10.* *_cpython
python_impl: cpython
r_base: '3.5'
target_platform: linux-64
zip_keys:
- - python
  - channel_sources
zlib: '1'
zstd: '1.5'
