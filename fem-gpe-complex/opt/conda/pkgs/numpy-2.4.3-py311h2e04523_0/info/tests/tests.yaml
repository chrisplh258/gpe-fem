- python:
    imports:
    - numpy
    - numpy.ctypeslib
    - numpy.distutils
    - numpy.dtypes
    - numpy.exceptions
    - numpy.f2py
    - numpy.fft
    - numpy.lib
    - numpy.lib.format
    - numpy.lib.mixins
    - numpy.lib.recfunctions
    - numpy.lib.scimath
    - numpy.lib.stride_tricks
    - numpy.lib.npyio
    - numpy.lib.introspect
    - numpy.lib.array_utils
    - numpy.linalg
    - numpy.ma
    - numpy.ma.extras
    - numpy.ma.mrecords
    - numpy.polynomial
    - numpy.polynomial.chebyshev
    - numpy.polynomial.hermite
    - numpy.polynomial.hermite_e
    - numpy.polynomial.laguerre
    - numpy.polynomial.legendre
    - numpy.polynomial.polynomial
    - numpy.random
    - numpy.testing
    - numpy.testing.overrides
    - numpy.typing
    - numpy.typing.mypy_plugin
    - numpy.version
    - numpy.core.multiarray
    - numpy.core.numeric
    - numpy.core.umath
    - numpy.linalg.lapack_lite
    - numpy.random.mtrand
- script:
    content: f2py -h
- script:
    interpreter: python
    content: |-
      import numpy, sys
      tests_to_skip = "_not_a_real_test"
      param = {"verbose": 1, "label": "full", "tests": None}
      extra_argv = ["-k", f"not ({tests_to_skip})", "-nauto", "--timeout=3000", "--durations=50", "--maxfail=100"]
      print(f"running with args: kwargs={param}, extra_argv={extra_argv}")
      sys.exit(not numpy.test(**param, extra_argv=extra_argv))
  requirements:
    run:
    - pytest
    - pytest-timeout
    - pytest-xdist
    - cython
    - hypothesis
    - meson
    - pytz
    - setuptools <60.0.0
    - typing_extensions
    - gcc_linux-64 14.*
    - gxx_linux-64 14.*
    - gfortran_linux-64 14.*
    - pkg-config
