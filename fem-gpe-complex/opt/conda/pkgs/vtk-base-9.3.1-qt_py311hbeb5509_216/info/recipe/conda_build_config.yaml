CI: azure
build_variant: qt
c_compiler: gcc
c_stdlib: sysroot
c_stdlib_version: '2.17'
cdt_name: conda
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: gxx
cxx_compiler_version: '13'
docker_image: quay.io/condaforge/linux-anvil-x86_64:cos7
expat: '2'
extend_keys:
- ignore_version
- ignore_build_only_deps
- pin_run_as_build
- extend_keys
ffmpeg: '7'
fortran_compiler: gfortran
fortran_compiler_version: '13'
freetype: '2'
glew: '2.1'
hdf5: 1.14.3
ignore_build_only_deps:
- python
- numpy
jsoncpp: 1.9.6
libboost_headers: '1.86'
libjpeg_turbo: '3'
liblzma_devel: '5'
libnetcdf: 4.9.2
libpng: '1.6'
libtiff: '4.7'
libuuid: '2'
libxcb: '1'
libxml2: '2'
lua: '5'
lz4_c: '1.10'
numpy: '1.26'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
proj: '9.5'
pugixml: '1.15'
python: 3.11.* *_cpython
qt6_main: '6.8'
r_base: '3.5'
replacements:
  all_replacements:
  - glob_patterns:
    - '*.cmake'
    regex_re: ([^;\s"]+/sysroot)
    replacement_re: $ENV{CONDA_BUILD_SYSROOT}
    tag: CMake build metadata
  - glob_patterns:
    - '*.cmake'
    regex_re: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
    replacement_re: $ENV{CONDA_BUILD_SYSROOT}
    tag: CMake build metadata OSX
sqlite: '3'
target_platform: linux-64
tbb: '2021'
tbb_devel: '2021'
tk: '8.6'
vtk: 9.3.1
zip_keys:
- - cxx_compiler_version
  - fortran_compiler_version
zlib: '1'
