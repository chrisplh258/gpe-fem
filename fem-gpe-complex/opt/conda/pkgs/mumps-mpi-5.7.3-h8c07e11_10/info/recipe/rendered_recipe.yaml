        name: mumps-include
        exact: true
    run_constraints:
    - libopenblas * *openmp*
    run_exports:
      weak:
      - pin_subpackage:
          name: mumps-mpi
          lower_bound: x.x.x.x.x.x
          upper_bound: x.x.x
  tests:
  - package_contents:
      files:
      - lib/pkgconfig/smumps.pc
      - lib/pkgconfig/dmumps.pc
      - lib/pkgconfig/cmumps.pc
      - lib/pkgconfig/zmumps.pc
      lib:
      - mumps_common
      - pord
      - smumps
      - dmumps
      - cmumps
      - zmumps
  - script: run_test-mpi
