    sha256: 84a47f7c4231b9efdf4d4f631a2cae2bdd9adeaabc088261d15af040143ed112
    patches:
    - flang-support.patch
  build:
    number: 10
    string: h8c07e11_10
    script: build-mumps
  requirements:
    build:
    - gfortran_linux-64 13.*
    - gcc_linux-64 13.*
    - sysroot_linux-64 2.17.*
    - make
    - libgomp
    - patchelf
    - python 3.11.*
    host:
    - libblas
    - liblapack
    - mpich
    - metis
